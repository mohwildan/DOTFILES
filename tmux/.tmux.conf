# =========================================================
# 🚀 TMUX CONFIGURATION FOR NEOVIM & MACOS (DEFAULT KEYS)
# =========================================================

# 1. Enable mouse support (click to select panes/windows, drag to resize)
set -g mouse on

# 2. Fix Escape key lag for Neovim (Instant <Esc> and 'jk' response)
set -s escape-time 10

# 3. Enable TrueColor (24-bit RGB) and 256-color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",kitty:RGB"
set -ag terminal-overrides ",wezterm:RGB"

# 4. Enable Extended Keys (Pass Ctrl+Shift+hjkl, Ctrl+Enter, Ctrl+Space to Neovim)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# 5. Enable focus events & passthrough (Neovim AutoSave, diagnostics, images)
set -g focus-events on
set -g allow-passthrough on
set -s set-clipboard on

# 6. Vi Mode in Copy/Scrollback Mode (<C-b> [)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# 7. Increase history scrollback limit
set -g history-limit 50000

# 8. Start window and pane indexing at 1 (matches keyboard 1-9 layout)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =========================================================
# 🎨 SLEEK MODERN STATUS BAR (Decay Dark & JetBrainsMono NF)
# =========================================================
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 2

# Status Bar Colors (Matches dark editor aesthetic)
set -g status-style "bg=#101419,fg=#68768e"

# Window List Formatting
set -g window-status-separator " "
set -g window-status-format "#[fg=#68768e,bg=#171b20] #I:#W "
set -g window-status-current-format "#[fg=#86deb7,bg=#101419,bold]#[fg=#101419,bg=#86deb7,bold]#I:#W#[fg=#86deb7,bg=#101419,bold]"

# Left Status (Session Name Pill)
set -g status-left-length 50
set -g status-left "#[fg=#101419,bg=#86aaec,bold] 󰘳 #S #[fg=#86aaec,bg=#101419,nobold] "

# Right Status (Folder + Time Pill)
set -g status-right-length 100
set -g status-right "#[fg=#171b20,bg=#101419]#[fg=#68768e,bg=#171b20]󰈔 #{b:pane_current_path} #[fg=#86aaec,bg=#171b20]│#[fg=#98d3cb,bg=#171b20] 󰥔 %H:%M #[fg=#171b20,bg=#101419]"

# Pane Borders (Clean minimalist outline)
set -g pane-border-style "fg=#1c222b"
set -g pane-active-border-style "fg=#86deb7"

# Message / Command Prompt Style
set -g message-style "bg=#171b20,fg=#86deb7,bold"
